services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html  # <-- Cambio clave: Mapeamos todo el proyecto
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_super_secreto
      MYSQL_DATABASE: finance_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d

volumes:
  db_data: