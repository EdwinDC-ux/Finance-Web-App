services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    # NUEVO: Zona horaria para PHP
    environment:
      - TZ=America/Mexico_City

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # ACTUALIZADO: Zona horaria para MySQL
    environment:
      - TZ=America/Mexico_City
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - LANG=C.UTF-8
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d

  # SERVICIO PARA VITE (TYPESCRIPT)
  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.trycloudflare.com

volumes:
  db_data: