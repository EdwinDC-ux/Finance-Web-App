<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance App SaaS</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto;">

  <!-- VISTA 0: PANTALLA DE CARGA -->
  <div id="loading-view" style="text-align: center; margin-top: 100px;">
    <h2>⏳ Cargando tu imperio...</h2>
  </div>

  <!-- VISTA 1: AUTENTICACIÓN -->
  <div id="auth-view" style="display: none; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 50px auto; text-align: center;">
    
    <div id="login-section">
      <h2>Iniciar Sesión</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Correo electrónico" required style="width: 90%; padding: 10px; margin-bottom: 15px;"><br>
        <input type="password" id="login-password" placeholder="Contraseña" required style="width: 90%; padding: 10px; margin-bottom: 15px;"><br>
        <button type="submit" style="width: 95%; padding: 10px; background: #2980b9; color: white; border: none; border-radius: 5px; cursor: pointer;">Entrar</button>
      </form>
      <p style="margin-top: 15px; font-size: 0.9rem;">¿No tienes cuenta? <a href="#" id="show-register" style="color: #2980b9;">Regístrate aquí</a></p>
    </div>

    <div id="register-section" style="display: none;">
      <h2>Crear Cuenta</h2>
      <form id="register-form">
        <input type="email" id="register-email" placeholder="Tu correo" required style="width: 90%; padding: 10px; margin-bottom: 15px;"><br>
        <input type="password" id="register-password" placeholder="Crea una contraseña" required style="width: 90%; padding: 10px; margin-bottom: 15px;"><br>
        <button type="submit" style="width: 95%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer;">Registrarme</button>
      </form>
      <p style="margin-top: 15px; font-size: 0.9rem;">¿Ya tienes cuenta? <a href="#" id="show-login" style="color: #2980b9;">Inicia sesión</a></p>
    </div>

  </div>

  <!-- VISTA 2: DASHBOARD -->
  <div id="dashboard-view" style="display: none;">
    
    <div style="text-align: right; margin-bottom: 10px;">
      <button id="logout-btn" style="padding: 5px 15px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer;">Cerrar Sesión</button>
    </div>

    <div style="background: #2c3e50; color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px;">
        <h2 style="margin: 0; font-size: 1.2rem; color: #bdc3c7;">Patrimonio Neto</h2>
        <h1 id="net-worth" style="margin: 10px 0 0 0; font-size: 3rem;">$0.00</h1>
    </div>

    <!-- Formulario para Crear Cuenta -->
    <div style="background: #ecf0f1; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
      <h3 style="margin-top: 0;">🏦 Añadir Nueva Cuenta</h3>
      <form id="add-account-form" style="display: flex; gap: 10px; align-items: center;">
        <input type="text" id="new-account-name" placeholder="Ej. Banamex, Nu, GBM" required style="padding: 8px; flex: 1;">
        <input type="number" id="new-account-balance" placeholder="Saldo Inicial" step="0.01" required style="padding: 8px; width: 120px;">
        <button type="submit" style="padding: 8px 15px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">Añadir</button>
      </form>
    </div>
    
    <div id="accounts-container"></div>

    <hr style="margin: 30px 0;">

    <h2>🔄 Registrar Movimiento</h2>
    <form id="transfer-form" style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
      <label>Monto: $<input type="number" id="amount" step="0.01" required></label><br><br>
      <label>Origen: <select id="origin"></select></label><br><br>
      <label>Destino: <select id="destination"></select></label><br><br>
      <button type="submit" style="padding: 10px 20px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 5px;">Ejecutar</button>
    </form>

    <hr style="margin: 30px 0;">

    <h2>📜 Últimos Movimientos</h2>
    <div id="history-container"></div>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
